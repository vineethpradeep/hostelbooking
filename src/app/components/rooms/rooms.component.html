<section class="rooms-section py-5">
  <div class="container">
    <div class="row g-4 justify-content-center">

      <div class="col-lg-4 col-md-6 col-sm-10" *ngFor="let room of rooms">
        <div class="room-card rounded-4 overflow-hidden shadow-sm position-relative">

          <!-- Room Image -->
          <div
            class="room-image position-relative"
            [ngStyle]="{ 'background-image': 'url(' + room.image + ')' }">

            <div class="overlay d-flex justify-content-center align-items-center">
              <button
                class="view-btn btn btn-light px-4 py-2 rounded-pill fw-semibold"
                (click)="onViewDetails(room.id)">
                View Details
              </button>
            </div>
          </div>

          <!-- Room Content -->
          <div class="room-content p-4 text-center">
            <h4 class="fw-bold mb-1">{{ room.name }}</h4>
            <p class="text-muted mb-2">{{ room.size }}</p>

            <h3 class="text-primary fw-bold mb-4">
              ₹{{ room.price | number }}
              <span class="fs-6 text-muted">/month</span>
            </h3>

            <ul class="list-unstyled text-start">
              <li>
                <i class="bi bi-people-fill me-2"></i>
                Max {{ room.capacity }} Person{{ room.capacity > 1 ? 's' : '' }}
              </li>

              <li *ngFor="let feature of room.services">
                <i class="bi bi-check-circle-fill me-2"></i>
                {{ feature }}
              </li>
            </ul>
          </div>

        </div>
      </div>

    </div>
  </div>
</section>
