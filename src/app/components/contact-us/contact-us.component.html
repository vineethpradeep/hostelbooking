<section class="contact">
  <div class="container">
    <div class="grid">
      <div class="info">
        <h1>Contact Us</h1>
        <p>
          Have questions or need help with a booking? We’re happy to assist.
        </p>

        <ul class="info-list" aria-label="Contact information">
          <li>
            <i class="bi bi-geo-alt-fill"></i>
            <strong>Address:</strong> 123 RS Puram, Coimbatore - India
          </li>
          <li>
            <i class="bi bi-telephone-fill"></i>
            <strong>Phone:</strong> +91-9876543210
          </li>
          <li>
            <i class="bi bi-envelope-fill"></i>
            <strong>Email:</strong> info&#64;karthickpg.com
          </li>
        </ul>

        <div class="map-card">
          <iframe
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3916.234567890!2d76.955832!3d11.016844!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3ba859f123456789%3A0xabcdef123456789!2sRS%20Puram%2C%20Coimbatore%2C%20India!5e0!3m2!1sen!2sin!4v1700000000000"
            width="100%"
            height="250"
            style="border: 0"
            allowfullscreen=""
            loading="lazy"
            referrerpolicy="no-referrer-when-downgrade"
          ></iframe>
        </div>
      </div>

      <div class="form-card">
        <form
          [formGroup]="form"
          (ngSubmit)="onSubmit()"
          novalidate
          aria-label="Contact form"
        >
          <div class="field">
            <label for="name">Your Name *</label>
            <input
              id="name"
              type="text"
              formControlName="name"
              placeholder="Enter your name"
            />
          </div>

          <div class="field">
            <label for="email">Email Address *</label>
            <input
              id="email"
              type="email"
              formControlName="email"
              placeholder="Enter your email"
            />
          </div>

          <div class="field">
            <label for="subject">Subject</label>
            <input
              id="subject"
              type="text"
              formControlName="subject"
              placeholder="Subject (optional)"
            />
          </div>

          <div class="field">
            <label for="message">Message *</label>
            <textarea
              id="message"
              rows="6"
              formControlName="message"
              placeholder="Write your message"
            ></textarea>
          </div>

          <button
            type="submit"
            [disabled]="form.invalid || submitting"
            class=""
          >
            {{ submitting ? "Sending…" : "Send Message" }}
          </button>

          <p class="success" *ngIf="submitSuccess" aria-live="polite">
            Thanks! Your message has been sent.
          </p>
          <p class="error" *ngIf="submitError" aria-live="assertive">
            {{ submitError }}
          </p>
        </form>
      </div>
    </div>
  </div>
</section>
