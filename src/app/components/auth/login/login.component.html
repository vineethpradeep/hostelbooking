<section class="auth-section">
  <div class="auth-container">

    <!-- Left: Brand Panel -->
    <div class="auth-brand-panel">
      <div class="brand-content">
        <img src="assets/img/logo.png" alt="Karthick PG Logo" class="auth-logo" />
        <h2>Welcome Back</h2>
        <p>
          Your home away from home. Comfortable, affordable, and
          fully-furnished PG accommodations in prime locations.
        </p>
        <div class="brand-stats">
          <div class="stat-chip">
            <strong>200+</strong>
            <span>Happy Residents</span>
          </div>
          <div class="stat-chip">
            <strong>5+</strong>
            <span>Years of Trust</span>
          </div>
          <div class="stat-chip">
            <strong>10+</strong>
            <span>Properties</span>
          </div>
          <div class="stat-chip">
            <strong>4.8★</strong>
            <span>Avg. Rating</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Right: Form Panel -->
    <div class="auth-form-panel">
      <div class="form-wrapper">
        <h3>Sign In</h3>
        <p class="text-muted mb-4">Enter your credentials to continue</p>

        <form [formGroup]="loginForm" (ngSubmit)="submit()">

          <div class="mb-3">
            <label class="form-label">Email Address *</label>
            <input
              type="email"
              formControlName="userName"
              class="form-control"
              placeholder="Enter your email"
            />
          </div>

          <div class="mb-3">
            <label class="form-label">Password *</label>
            <input
              type="password"
              formControlName="password"
              class="form-control"
              placeholder="Enter password"
            />
          </div>

          <!-- Error Alert -->
          <div *ngIf="errorMessage" class="alert alert-danger text-center">
            {{ errorMessage }}
          </div>

          <button
            class="btn btn-primary w-100"
            type="submit"
            [disabled]="submitting || loginForm.invalid"
          >
            <i class="bi bi-box-arrow-in-right me-1" *ngIf="!submitting"></i>
            {{ submitting ? 'Logging in…' : 'Login' }}
          </button>
        </form>

        <div class="text-center mt-3">
          <span class="text-muted">Don't have an account?</span>
          <a routerLink="/auth/register" class="fw-semibold text-primary ms-1">
            Sign up
          </a>
        </div>
      </div>
    </div>

  </div>
</section>
