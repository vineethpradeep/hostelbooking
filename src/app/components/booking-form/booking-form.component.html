<div class="booking-root container">
  <div class="card shadow-sm">
    <div class="card-body">
      <form [formGroup]="bookingForm" (ngSubmit)="save()">

        <!-- Check-in Date -->
        <div class="row mb-3">
          <div class="col-md-12">
            <label class="form-label">
              Check-in Date <span class="text-danger">*</span>
            </label>
            <input type="date" formControlName="checkInDate" class="form-control"
              [class.is-invalid]="bookingForm.get('checkInDate')?.touched && bookingForm.get('checkInDate')?.invalid" />

            <div class="invalid-feedback" *ngIf="bookingForm.get('checkInDate')?.touched && bookingForm.get('checkInDate')?.hasError('required')">
              Check-in date is required.
            </div>
          </div>
        </div>

        <!-- Check-out Date -->
        <div class="row mb-3">
          <div class="col-md-12">
            <label class="form-label">
              Check-out Date <span class="text-danger">*</span>
            </label>
            <input type="date" formControlName="checkOutDate" class="form-control"
              [class.is-invalid]="bookingForm.get('checkOutDate')?.touched && bookingForm.get('checkOutDate')?.invalid" />

            <div class="invalid-feedback" *ngIf="bookingForm.get('checkOutDate')?.touched && bookingForm.get('checkOutDate')?.hasError('required')">
              Check-out date is required.
            </div>
          </div>
        </div>

        <!-- Monthly Rent -->
        <div class="row mb-3">
          <div class="col-md-12">
            <label class="form-label">
              Monthly Rent <span class="text-danger">*</span>
            </label>
            <input type="number" min="1" step="0.01" formControlName="monthlyRent" class="form-control" placeholder="₹0.00"
              [class.is-invalid]="bookingForm.get('monthlyRent')?.touched && bookingForm.get('monthlyRent')?.invalid" />

            <div class="invalid-feedback" *ngIf="bookingForm.get('monthlyRent')?.touched && bookingForm.get('monthlyRent')?.hasError('required')">
              Monthly rent is required.
            </div>
            <div class="invalid-feedback" *ngIf="bookingForm.get('monthlyRent')?.touched && bookingForm.get('monthlyRent')?.hasError('min')">
              Rent must be more than 0.
            </div>
          </div>
        </div>

        <!-- Security Deposit -->
        <div class="row mb-3">
          <div class="col-md-12">
            <label class="form-label">
              Security Deposit <span class="text-danger">*</span>
            </label>
            <input type="number" min="0" step="0.01" formControlName="securityDeposit" class="form-control" placeholder="₹0.00"
              [class.is-invalid]="bookingForm.get('securityDeposit')?.touched && bookingForm.get('securityDeposit')?.invalid" />

            <div class="invalid-feedback" *ngIf="bookingForm.get('securityDeposit')?.touched && bookingForm.get('securityDeposit')?.hasError('required')">
              Security deposit is required.
            </div>
            <div class="invalid-feedback" *ngIf="bookingForm.get('securityDeposit')?.touched && bookingForm.get('securityDeposit')?.hasError('min')">
              Deposit cannot be negative.
            </div>
          </div>
        </div>

        <!-- Booking Type -->
        <div class="row mb-3">
          <div class="col-md-12">
            <label class="form-label">
              Booking Type <span class="text-danger">*</span>
            </label>
            <input type="text" formControlName="bookingType" class="form-control" placeholder="Online / Walk-in"
              [class.is-invalid]="bookingForm.get('bookingType')?.touched && bookingForm.get('bookingType')?.invalid" />

            <div class="invalid-feedback" *ngIf="bookingForm.get('bookingType')?.touched && bookingForm.get('bookingType')?.hasError('required')">
              Booking type is required.
            </div>
          </div>
        </div>

        <!-- Special Requests (NO required asterisk) -->
        <div class="row mb-3">
          <div class="col-md-12">
            <label class="form-label">Special Requests</label>
            <textarea rows="3" formControlName="specialRequests" class="form-control"
              placeholder="Any special request?"></textarea>
          </div>
        </div>

        <!-- Buttons -->
        <div class="mt-4 d-flex gap-3">
          <button type="submit" class="btn btn-primary px-4">
            {{ selectedId ? 'Update' : 'Create' }}
          </button>

          <button type="button" (click)="cancel()" class="btn btn-secondary px-4">
            Cancel
          </button>
        </div>

      </form>
    </div>
  </div>
</div>
