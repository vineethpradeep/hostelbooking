<div class="booking-root container">
 
  <div class="card shadow-sm">
    <div class="card-body">
      <form [formGroup]="bookingForm" (ngSubmit)="save()">
        <!-- Booking Number -->
        <!-- <div class="row mb-3">
          <div class="col-md-12">
            <label class="form-label">Booking Number</label>
            <input type="text" formControlName="bookingNumber" class="form-control" placeholder="Enter booking number" />
          </div>
        </div> -->

        <!-- Check-in Date -->
        <div class="row mb-3">
          <div class="col-md-12">
            <label class="form-label">Check-in Date</label>
            <input type="date" formControlName="checkInDate" class="form-control" />
          </div>
        </div>

        <!-- Check-out Date -->
        <div class="row mb-3">
          <div class="col-md-12">
            <label class="form-label">Check-out Date</label>
            <input type="date" formControlName="checkOutDate" class="form-control" />
          </div>
        </div>

        <!-- Monthly Rent -->
        <div class="row mb-3">
          <div class="col-md-12">
            <label class="form-label">Monthly Rent</label>
            <input type="number" step="0.01" formControlName="monthlyRent" class="form-control" placeholder="₹0.00" />
          </div>
        </div>

        <!-- Security Deposit -->
        <div class="row mb-3">
          <div class="col-md-12">
            <label class="form-label">Security Deposit</label>
            <input type="number" step="0.01" formControlName="securityDeposit" class="form-control" placeholder="₹0.00" />
          </div>
        </div>

        <!-- Booking Type -->
        <div class="row mb-3">
          <div class="col-md-12">
            <label class="form-label">Booking Type</label>
            <input type="text" formControlName="bookingType" class="form-control" placeholder="Online / Walk-in" />
          </div>
        </div>

        <!-- Special Requests -->
        <div class="row mb-3">
          <div class="col-md-12">
            <label class="form-label">Special Requests</label>
            <textarea
              rows="3"
              formControlName="specialRequests"
              class="form-control"
              placeholder="Any special request?"
            ></textarea>
          </div>
        </div>

        <!-- Buttons -->
        <div class="mt-4 d-flex gap-3">
          <button type="submit" class="btn btn-primary px-4">
            {{ selectedId ? 'Update' : 'Create' }}
          </button>

          <button type="button" (click)="cancel()" class="btn btn-secondary px-4">
            Cancel
          </button>
        </div>

      </form>

      <!-- Validation -->
      <div *ngIf="bookingForm.invalid && bookingForm.touched" class="alert alert-danger mt-3">
        Please fix validation errors.
      </div>

    </div>
  </div>

</div>
