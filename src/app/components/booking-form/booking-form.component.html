<div class="booking-root container">
  <div class="card shadow-sm">
    <div class="card-body">
      <form [formGroup]="bookingForm" (ngSubmit)="save()">

        <!-- Hidden required fields -->
        <input type="hidden" formControlName="bookingNumber" />
        <input type="hidden" formControlName="propertyId" />
        <input type="hidden" formControlName="userId" />
        <input type="hidden" formControlName="bedId" />

        <!-- ❌ Removed plannedCheckOutDate hidden input -->

        <!-- Check-in -->
        <div class="mb-3">
          <label class="form-label">Check-in Date <span class="text-danger">*</span></label>
          <input
            type="date"
            formControlName="checkInDate"
            class="form-control"
            [class.is-invalid]="f['checkInDate'].touched && f['checkInDate'].invalid"
          />
          <div class="invalid-feedback">Check-in date is required.</div>
        </div>

        <!-- Check-out -->
        <div class="mb-3">
          <label class="form-label">Check-out Date <span class="text-danger">*</span></label>
          <input
            type="date"
            formControlName="checkOutDate"
            class="form-control"
            [class.is-invalid]="f['checkOutDate'].touched && f['checkOutDate'].invalid"
          />
          <div class="invalid-feedback">Check-out date is required.</div>
        </div>

        <!-- Monthly Rent -->
        <div class="mb-3">
          <label class="form-label">Monthly Rent <span class="text-danger">*</span></label>
          <input
            type="number"
            formControlName="monthlyRent"
            class="form-control"
            placeholder="₹0.00"
            [class.is-invalid]="f['monthlyRent'].touched && f['monthlyRent'].invalid"
          />
          <div class="invalid-feedback">Monthly rent is required.</div>
        </div>

        <!-- Security Deposit -->
        <div class="mb-3">
          <label class="form-label">Security Deposit <span class="text-danger">*</span></label>
          <input
            type="number"
            formControlName="securityDeposit"
            class="form-control"
            [class.is-invalid]="f['securityDeposit'].touched && f['securityDeposit'].invalid"
          />
          <div class="invalid-feedback">Security deposit is required.</div>
        </div>

        <!-- Booking Type -->
        <div class="mb-3">
          <label class="form-label">Booking Type <span class="text-danger">*</span></label>
          <input
            type="text"
            formControlName="bookingType"
            class="form-control"
            placeholder="Online / Walk-in"
            [class.is-invalid]="f['bookingType'].touched && f['bookingType'].invalid"
          />
          <div class="invalid-feedback">Booking type is required.</div>
        </div>

        <!-- Special Requests -->
        <div class="mb-3">
          <label class="form-label">Special Requests</label>
          <textarea rows="3" formControlName="specialRequests" class="form-control"></textarea>
        </div>

        <!-- Buttons -->
        <div class="mt-4 d-flex gap-3">
          <button type="submit" class="btn btn-primary px-4">CREATE</button>
          <button type="button" (click)="cancel()" class="btn btn-secondary px-4">CANCEL</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- BOOTSTRAP POPUP MODAL ALERT -->
<div class="modal fade" id="popupAlert" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header" [ngClass]="{ 'bg-success': successMessage, 'bg-danger': errorMessage }">
        <h5 class="modal-title text-white">{{ successMessage ? 'Success' : 'Error' }}</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <div class="modal-body">
        <p *ngIf="successMessage">{{ successMessage }}</p>
        <p *ngIf="errorMessage">{{ errorMessage }}</p>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-primary" data-bs-dismiss="modal">OK</button>
      </div>
    </div>
  </div>
</div>
