<div class="card p-3 shadow-sm">
  <h5 class="mb-3">User Details</h5>

  <table class="table table-bordered table-hover">
    <thead class="table-dark">
      <tr>
        <th>#</th>
        <th>First Name</th>
        <th>Last Name</th>
        <th>Email Address</th>
        <th>Phone Number</th>
        <th style="width:150px">Actions</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let u of users; let i = index">
        <td>{{ i + 1 }}</td>
        <td>{{ u.FirstName }}</td>
        <td>{{ u.LastName }}</td>
        <td>{{ u.EmailAddress }}</td>
        <td>{{ u.PhoneNumber }}</td>

        <td class="text-center">
          <button
            class="btn btn-outline-primary btn-sm me-2"
            (click)="editUser(u)">
            EDIT
          </button>

          <button
            class="btn btn-outline-danger btn-sm"
            (click)="openConfirmDeleteModal(u.UserId)">
            DELETE
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</div>

<!-- ================= EDIT USER MODAL ================= -->
<div class="modal fade" id="editUserModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">Edit User</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <label class="form-label">First Name</label>
        <input class="form-control mb-2"
               [(ngModel)]="selectedUser.FirstName">

        <label class="form-label">Last Name</label>
        <input class="form-control mb-2"
               [(ngModel)]="selectedUser.LastName">

        <label class="form-label">Email Address</label>
        <input class="form-control mb-2"
               [(ngModel)]="selectedUser.EmailAddress">

        <label class="form-label">Phone Number</label>
        <input class="form-control mb-2"
               [(ngModel)]="selectedUser.PhoneNumber">
      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary"
                data-bs-dismiss="modal">
          Cancel
        </button>
        <button class="btn btn-primary"
                (click)="openConfirmUpdateModal()">
          Save Changes
        </button>
      </div>

    </div>
  </div>
</div>

<!-- ================= CONFIRM UPDATE MODAL ================= -->
<div class="modal fade" id="confirmUserUpdateModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-sm">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">Confirm Update</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body text-center">
        Are you sure you want to update this user?
      </div>

      <div class="modal-footer justify-content-center">
        <button class="btn btn-secondary"
                data-bs-dismiss="modal">
          No
        </button>
        <button class="btn btn-primary"
                (click)="confirmSaveUser()">
          Yes
        </button>
      </div>

    </div>
  </div>
</div>

<!-- ================= CONFIRM DELETE MODAL ================= -->
<div class="modal fade" id="confirmUserDeleteModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-sm">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title text-danger">Confirm Delete</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body text-center">
        Are you sure you want to delete this user?
      </div>

      <div class="modal-footer justify-content-center">
        <button class="btn btn-secondary"
                data-bs-dismiss="modal">
          No
        </button>
        <button class="btn btn-danger"
                (click)="confirmDeleteUser()">
          Yes
        </button>
      </div>

    </div>
  </div>
</div>
