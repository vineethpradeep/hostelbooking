<div class="container-fluid mt-4">
  <h3 class="page-title">Payment Details</h3>

  <div class="table-responsive mt-3">
    <table class="table table-bordered table-hover">
      <thead class="table-dark">
        <tr>
          <th>#</th>
             <th>Booking Number</th>
          <th>Transaction ID</th>
          <th>Phone</th>
          <th>Amount</th>
          <th>Status</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let p of paymentList; let i = index">
          <td>{{ i + 1 }}</td>
         <td>{{ p.bookingNumber }}</td>
          <td>{{ p.transactionId }}</td>
          <td>{{ p.phone }}</td>
          <td>{{ p.amount }}</td>
          <td>
            <span
              class="badge"
              [ngClass]="{
                'bg-success': p.status === 'Success'|| p.status === 'Paid',
                'bg-warning text-dark': p.status === 'Pending',
                'bg-danger': p.status === 'Failed'
              }"
            >
              {{ p.status }}
            </span>
          </td>
        </tr>

        <tr *ngIf="paymentList.length === 0">
          <td colspan="5" class="text-center">No payments found</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
