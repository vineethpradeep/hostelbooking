<section class="room-details-section py-5" *ngIf="room">
  <div class="container">
    <div class="row g-4">
      <div class="col-lg-4">
        
        <div class="room-details-item shadow-lg rounded overflow-hidden position-relative">

          <div class="room-image position-relative">
            <img [src]="room.image" [alt]="room.name" class="img-fluid" />
            <div class="book-now-overlay d-flex justify-content-center align-items-center">
              <p class="text-center text-white fw-semibold px-4 py-2 bg-dark bg-opacity-75 rounded-pill">
                {{ room.services[0] }}
              </p>
            </div>
          </div>

          <div class="rd-text p-4">
            <div class="d-flex justify-content-between align-items-center mb-2">
              <h3 class="room-name mb-0">{{ room.name }}</h3>

              <!-- ❌ Book Now button removed -->
              
            </div>

            <h5 class="room-price text-primary fw-bold mb-3">
              ₹{{ room.price }} <span class="text-muted fs-6">/Month</span>
            </h5>

            <h4 class="room-size text-muted fw-normal mb-3">
              {{ room.size }} / {{ room.capacity }} Person
            </h4>

            <ul class="list-unstyled room-features d-flex flex-wrap gap-3 mb-3">
              <li *ngFor="let feature of room.services" class="d-flex align-items-center">
                <i class="bi bi-check-circle-fill text-success me-2"></i>
                <span>{{ feature }}</span>
              </li>
            </ul>

            <p class="text-muted small">
              {{ room.description || "Perfect stay with all amenities included." }}
            </p>
          </div>
        </div>
      </div>
      <div class="col-lg-8">
        <div class="room-booking shadow-sm rounded">
          <app-edit-booking></app-edit-booking>
        </div>
      </div>

    </div>
  </div>
</section>
