<section class="room-details-section" *ngIf="room">
  <div class="container">
    <div class="row g-4">

      <!-- Room Info Card -->
      <div class="col-lg-4">
        <div class="room-details-item">
          <div class="room-image">
            <img [src]="room.Image" [alt]="room.Name" />
          </div>

          <div class="rd-text">
            <h3 class="room-name mb-1">{{ room.Name }}</h3>

            <div class="room-price text-primary fw-bold mb-3">
              ₹{{ room.RentPerBed }} <span class="text-muted">/Month</span>
            </div>

            <div class="room-size d-flex align-items-center flex-wrap mb-3">
              <span><i class="bi bi-bed text-primary"></i> {{ room.Size }}</span>
              <span class="ms-3">
                <i class="bi bi-people-fill text-primary"></i> {{ room.Capacity }} Person
              </span>
            </div>

            <ul class="room-features mb-3">
              <li><i class="bi bi-snow text-info"></i> AC</li>
              <li><i class="bi bi-droplet text-primary"></i> Bathroom</li>
              <li><i class="bi bi-book text-warning"></i> Study Table</li>
              <li><i class="bi bi-box text-secondary"></i> Wardrobe</li>
            </ul>

            <p class="text-muted small">
              {{ room.Description || "Perfect stay with all amenities included." }}
            </p>
          </div>
        </div>
      </div>

      <!-- Booking Form -->
      <div class="col-lg-8">
        <div class="room-booking">
          <app-edit-booking [monthlyRent]="room.RentPerBed"></app-edit-booking>
        </div>
      </div>

    </div>
  </div>
</section>
