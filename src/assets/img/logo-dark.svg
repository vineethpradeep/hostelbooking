<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 48" width="210" height="48">

  <!-- ══ House Icon ══ -->

  <!-- Orange left wall of house -->
  <polygon points="4,44 4,24 14,14 14,44" fill="#f15a24"/>

  <!-- Orange roof peak (left side) -->
  <polygon points="0,26 14,12 14,16 4,27" fill="#f15a24"/>

  <!-- Cyan house body + K shape (right side) -->
  <!-- Main body right -->
  <rect x="14" y="20" width="18" height="24" fill="#17b3e8"/>

  <!-- Cyan roof right side -->
  <polygon points="14,12 32,12 32,20 14,20" fill="#0fa8d8"/>

  <!-- Roof peak right -->
  <polygon points="14,12 23,4 32,12" fill="#17b3e8"/>

  <!-- K cutout legs (white negative space in cyan block) -->
  <!-- Top diagonal of K -->
  <polygon points="19,22 26,22 26,26 23,29 26,32 26,36 19,36 19,33 22,30 19,27" fill="white"/>

  <!-- ══ Text ══ -->

  <!-- KARTHICK — dark for white bg -->
  <text
    x="40"
    y="28"
    font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
    font-weight="800"
    font-size="18"
    fill="#0f172a"
    letter-spacing="0.5"
  >KARTHICK</text>

  <!-- PG — orange accent -->
  <text
    x="41"
    y="42"
    font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
    font-weight="700"
    font-size="11"
    fill="#f15a24"
    letter-spacing="4"
  >PG</text>

</svg>
